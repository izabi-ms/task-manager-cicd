name: Docker Build


on:

  push:

    branches:
      - main



jobs:

  docker-build:


    runs-on: ubuntu-latest


    permissions:

      contents: read
      packages: write



    steps:


      - name: Checkout Code

        uses: actions/checkout@v4

      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3        



      - name: Build Backend Image

        run: |

          docker build \
          -t ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest \
          -t ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }} \
          ./backend



      - name: Build Frontend Image

        run: |

          docker build \
          -t ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest \
          -t ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }} \
          ./frontend



      - name: Trivy Backend Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }}

          format: table

          scanners: vuln

          ignore-unfixed: true

          severity: CRITICAL,HIGH

          exit-code: 1


      - name: Trivy Frontend Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }}

          format: table

          scanners: vuln

          ignore-unfixed: true

          severity: CRITICAL,HIGH

          exit-code: 1


      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Push Backend Image

        run: |

          docker push \
          ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest

          docker push \
          ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }}



      - name: Push Frontend Image

        run: |

          docker push \
          ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest

          docker push \
          ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }}