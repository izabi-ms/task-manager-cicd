name: Docker Build


on:

  push:

    branches:
      - main



jobs:


  docker-build:


    runs-on: ubuntu-latest


    permissions:

      contents: read


    steps:


      - name: Checkout Code

        uses: actions/checkout@v4



      - name: Build Backend Image

        run: |

          docker build \
          -t task-manager-backend \
          ./backend



      - name: Build Frontend Image

        run: |

          docker build \
          -t task-manager-frontend \
          ./frontend