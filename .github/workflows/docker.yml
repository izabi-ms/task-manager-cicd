name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ---------------- BACKEND ----------------

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest
            ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }}
          no-cache: true


      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }}
          format: table
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1


      - name: Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest
            ghcr.io/${{ github.repository_owner }}/task-manager-backend:${{ github.sha }}



      # ---------------- FRONTEND ----------------

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest
            ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }}
          no-cache: true


      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }}
          format: table
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1


      - name: Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest
            ghcr.io/${{ github.repository_owner }}/task-manager-frontend:${{ github.sha }}