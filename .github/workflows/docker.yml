name: Docker Build


on:

  push:

    branches:
      - main



jobs:

  docker-build:


    runs-on: ubuntu-latest


    permissions:

      contents: read
      packages: write



    steps:


      - name: Checkout Code

        uses: actions/checkout@v4



      - name: Build Backend Image

        run: |

          docker build \
          -t ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest \
          ./backend



      - name: Build Frontend Image

        run: |

          docker build \
          -t ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest \
          ./frontend



      - name: Trivy Backend Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest

          format: table

          exit-code: 0

          severity: CRITICAL,HIGH



      - name: Trivy Frontend Scan

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest

          format: table

          exit-code: 0

          severity: CRITICAL,HIGH



      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Push Backend Image

        run: |

          docker push \
          ghcr.io/${{ github.repository_owner }}/task-manager-backend:latest



      - name: Push Frontend Image

        run: |

          docker push \
          ghcr.io/${{ github.repository_owner }}/task-manager-frontend:latest